# ship-it configuration for Atmo
APP_NAME="Atmo"
PROJECT_TYPE="spm"
PACKAGE_PATH="AppleTVRemoteApp"
BUILD_DIR="AppleTVRemoteApp/build"
DIST_DIR="dist"
CONFIGURATION="Release"

# Custom hooks for Atmo's hybrid Python/Swift architecture
PRE_BUILD_HOOK="bash AppleTVRemoteApp/Scripts/package_python.sh"
POST_BUILD_HOOK="bash AppleTVRemoteApp/Scripts/bundle.sh"

# Inner-to-outer signing for embedded Python (.so → .dylib → framework → app)
#
# WARNING: the ship-it submodule does NOT honor SIGN_HOOK. Its notarize command
# runs a plain `codesign --deep` with no entitlements, which strips the
# app-sandbox/network entitlements from the app and the embedded Python and
# breaks Local Network discovery (the v1.1.0 regression). Do not use
# `./ship notarize` until ship-it supports SIGN_HOOK — follow the manual
# sequence in AppleTVRemoteApp/RELEASE.md instead.
SIGN_HOOK="bash AppleTVRemoteApp/Scripts/codesign_python_app.sh"
